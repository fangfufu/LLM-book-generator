output_dir: generated_books
generation_params:
  author_name: Fufu Fang
  author_gender: male
  main_topic: >-
    Counterintelligence operations against the Reptilian operatives embedded in the British establishment
  is_fiction: true
  fiction_chapter_count: 50
  generate_foreword: true
  generate_acknowledgements: true
  generate_appendix: true
  include_about_author_in_main_book: true
  setting: 'Contemporary world '
  num_chapter_fallback: 3
  num_sections_per_chapter_fallback: 2
  book_title: ''
  book_subtitle: ''
  writing_tone: ''
  random_topic_seed: ''
  length_modifier: ''
  generate_character_list: false
api_settings:
  provider: llama_cpp
  default_max_retries: 10
  default_retry_delay_seconds: 30
  base_cache_dir: api_cache
  base_scratchpad_dir: scratchpad
  llama_cpp:
    base_url: http://localhost:11434
    max_retries: 20
    retry_delay_seconds: 1
    request_timeout_seconds: 180
    # Model and generation parameters (configured directly in llama.cpp)
    model: gemma4:26B
    tokenizer_model: google/gemma-4-e2b-it
    # temperature: 0.8
    # context_window_size: 4096
    # disable_reasoning: false
    # llm_options:
    #   temperature: 0.8
    #   n_predict: -1
style_params:
  font_name: Cambria
  font_size: 11.0
  page_size_preset: 6x9
  margins_mm:
    top: 18
    bottom: 18
    right: 18
    left: 18
    gutter: 5
  inline_math_height_multiplier: 1.05
  display_math_height_inches: 0.5
  inline_math_vertical_offset_half_points: -5
debug_options:
  verbose_debug: true
  save_intermediate_html: true
  log_output_path: logs/book.log
